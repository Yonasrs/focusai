<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Group Report — FocusAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080B10;--bg2:#0D1117;--bg3:#121820;
  --surface:#141B24;--surface2:#1A2332;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#F0F4FF;--text2:#8B96A8;--text3:#4A5568;
  --cyan:#00D4FF;--violet:#7C6FFF;--green:#00E5A0;
  --amber:#FFB547;--red:#FF5E5E;
  --green-bg:rgba(0,229,160,0.07);--red-bg:rgba(255,94,94,0.07);
  --amber-bg:rgba(255,181,71,0.07);--cyan-bg:rgba(0,212,255,0.07);
  --violet-bg:rgba(124,111,255,0.07);
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}

nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:60px;background:rgba(8,11,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--text);text-decoration:none}
.logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--cyan),var(--violet));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 16px rgba(0,212,255,0.3)}
.nav-btn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--text2);background:var(--surface);border:1px solid var(--border);padding:7px 14px;border-radius:6px;cursor:pointer;text-decoration:none;transition:all .2s}
.nav-btn:hover{color:var(--cyan);border-color:rgba(0,212,255,0.3)}

.page{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 24px 80px}

/* HEADER */
.report-header{padding:48px 0 36px}
.report-eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
.report-title{font-size:clamp(28px,4vw,42px);font-weight:700;letter-spacing:-0.03em;margin-bottom:8px}
.report-meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:0.05em}

/* RECOMMENDATION BANNER */
.rec-banner{border-radius:16px;padding:28px 36px;margin-bottom:28px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.rec-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:1px}
.rec-launch{background:linear-gradient(135deg,rgba(0,229,160,0.1),rgba(0,212,255,0.05));border:1px solid rgba(0,229,160,0.25)}
.rec-launch::before{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.rec-revise{background:linear-gradient(135deg,rgba(255,181,71,0.1),rgba(255,94,94,0.05));border:1px solid rgba(255,181,71,0.25)}
.rec-revise::before{background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.rec-reject{background:linear-gradient(135deg,rgba(255,94,94,0.1),rgba(255,94,94,0.05));border:1px solid rgba(255,94,94,0.25)}
.rec-reject::before{background:linear-gradient(90deg,transparent,var(--red),transparent)}
.rec-verdict-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.rec-verdict{font-size:32px;font-weight:700;letter-spacing:-0.02em}
.rec-launch .rec-verdict{color:var(--green)}.rec-revise .rec-verdict{color:var(--amber)}.rec-reject .rec-verdict{color:var(--red)}
.rec-rationale{flex:1;min-width:220px;font-size:14px;color:var(--text2);line-height:1.65}
.rec-meta{display:flex;flex-direction:column;gap:10px;align-items:flex-end;flex-shrink:0}
.rec-score-num{font-family:'Space Mono',monospace;font-size:48px;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.rec-score-denom{font-family:'Space Mono',monospace;font-size:16px;color:var(--text3)}
.confidence-pill{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:100px}
.conf-high{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,229,160,0.2)}
.conf-medium{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(255,181,71,0.2)}
.conf-low{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,94,94,0.2)}

/* AUDIENCE SPLIT */
.split-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:40px}
.split-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.split-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px}
.split-loved .split-label{color:var(--green)}.split-rejected .split-label{color:var(--red)}.split-neutral .split-label{color:var(--text3)}
.split-names{display:flex;flex-wrap:wrap;gap:6px}
.split-name-chip{font-size:12px;padding:3px 10px;border-radius:100px}
.split-loved .split-name-chip{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,229,160,0.2)}
.split-rejected .split-name-chip{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,94,94,0.2)}
.split-neutral .split-name-chip{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* SECTION */
.section{margin-bottom:52px}
.sec-heading{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.sec-heading h2{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.sec-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--cyan);background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);padding:3px 8px;border-radius:4px}

/* ── COPY INTELLIGENCE ── */
.copy-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.copy-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.copy-head-left{display:flex;align-items:center;gap:12px}
.copy-head-icon{font-size:22px}
.copy-head-text h3{font-size:16px;font-weight:700;letter-spacing:-0.01em}
.copy-head-text p{font-size:12px;color:var(--text2)}
.copy-status-badge{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 12px;border-radius:100px}
.copy-clean{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,229,160,0.2)}
.copy-issues{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(255,181,71,0.2)}
.copy-scores-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px 24px;border-bottom:1px solid var(--border)}
.copy-score-box{text-align:center}
.copy-score-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.copy-score-val{font-family:'Space Mono',monospace;font-size:22px;font-weight:700}
.copy-body{padding:20px 24px}
.copy-signal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.copy-signal{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px}
.copy-signal-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.copy-signal p{font-size:13px;color:var(--text);line-height:1.5}
.copy-issues-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.copy-issue{background:var(--bg2);border:1px solid rgba(255,181,71,0.15);border-radius:8px;padding:12px 14px}
.copy-issue-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.copy-issue-type{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber);background:var(--amber-bg);padding:2px 7px;border-radius:4px}
.copy-issue-text{font-size:12px;font-style:italic;color:var(--text3)}
.copy-issue-problem{font-size:13px;color:var(--text2);margin-bottom:6px;line-height:1.5}
.copy-issue-fix{font-size:12px;color:var(--green);background:var(--green-bg);border-radius:4px;padding:4px 8px;display:inline-block}
.copy-rewrites{margin-top:4px}
.copy-rewrites-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rewrite-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.rewrite-orig{font-size:12px;color:var(--red);text-decoration:line-through;margin-bottom:4px}
.rewrite-new{font-size:13px;color:var(--green);font-weight:500;margin-bottom:4px}
.rewrite-reason{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace}
.claim-audit{margin-bottom:16px}
.claim-audit-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.claim-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.claim-item:last-child{border-bottom:none}
.claim-badge{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.claim-strong{background:var(--green-bg);color:var(--green)}
.claim-weak{background:var(--red-bg);color:var(--red)}
.claim-unsupported{background:var(--amber-bg);color:var(--amber)}
.claim-text{font-size:13px;color:var(--text2);line-height:1.5}
.claim-reason{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:2px}

/* ── CONFIDENCE ── */
.confidence-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:0}
.confidence-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.confidence-head-left{display:flex;align-items:center;gap:12px}
.confidence-body{padding:20px 24px}
.confidence-main{display:flex;align-items:center;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.reliability-dial{text-align:center;flex-shrink:0}
.reliability-num{font-family:'Space Mono',monospace;font-size:48px;font-weight:700;line-height:1;color:var(--cyan)}
.reliability-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-top:4px}
.confidence-reason{font-size:13px;color:var(--text2);line-height:1.65;flex:1;min-width:200px}
.spread-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spread-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.spread-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.spread-range{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--text);margin-bottom:3px}
.spread-delta{font-family:'Space Mono',monospace;font-size:11px}
.delta-low{color:var(--green)}.delta-med{color:var(--amber)}.delta-high{color:var(--red)}

/* ── PERSONA CARDS ── */
.personas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px}
.persona-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s;animation:card-in .4s ease both}
.persona-card:nth-child(1){animation-delay:.04s}.persona-card:nth-child(2){animation-delay:.08s}.persona-card:nth-child(3){animation-delay:.12s}.persona-card:nth-child(4){animation-delay:.16s}.persona-card:nth-child(5){animation-delay:.20s}
@keyframes card-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.persona-card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.4)}
.persona-stripe{height:3px}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.p-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.p-id{display:flex;align-items:center;gap:10px}
.p-emoji{font-size:24px}
.p-name{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.p-type{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.07em;color:var(--text3);text-transform:uppercase}
.scroll-badge{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:4px 10px;border-radius:100px;white-space:nowrap;flex-shrink:0}
.scroll-yes{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,229,160,0.2)}
.scroll-no{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,94,94,0.2)}
.demo-chips{display:flex;flex-wrap:wrap;gap:5px}
.demo-chip{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.p-body{padding:16px 18px 18px}

/* Score bars with reason tooltip */
.score-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.bar-item{text-align:center}
.bar-label{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:5px}
.bar-track{height:4px;background:var(--bg3);border-radius:100px;overflow:hidden;margin-bottom:4px}
.bar-fill{height:100%;border-radius:100px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.fill-a{background:linear-gradient(90deg,var(--amber),#FF8C00)}
.fill-t{background:linear-gradient(90deg,var(--green),#00B87A)}
.fill-i{background:linear-gradient(90deg,var(--violet),#5A4FCC)}
.bar-val{font-family:'Space Mono',monospace;font-size:15px;font-weight:700}
.score-reason{font-family:'Space Mono',monospace;font-size:9px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px 7px;margin-top:3px;line-height:1.4;text-align:left;letter-spacing:0.01em}

.trust-rubric{font-family:'Space Mono',monospace;font-size:10px;color:var(--cyan);background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.12);border-radius:5px;padding:5px 9px;margin-bottom:12px;line-height:1.6}
.evidence-pill{font-family:'Space Mono',monospace;font-size:10px;color:var(--cyan);background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);border-radius:5px;padding:5px 9px;margin-bottom:12px;line-height:1.5}
.reaction-text{font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.55}
.objection-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.objection-text{font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.quote-block{background:var(--bg2);border-left:2px solid var(--border2);border-radius:0 6px 6px 0;padding:10px 14px;font-size:13px;font-style:italic;color:var(--text2);line-height:1.55}

/* DEBATE */
.debate-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.debate-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.debate-icon{font-size:22px}.debate-head-text h3{font-size:16px;font-weight:700;letter-spacing:-0.01em}.debate-head-text p{font-size:12px;color:var(--text2)}
.debate-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px}
.exchange{display:flex;gap:10px;align-items:flex-start;animation:card-in .3s ease both}
.exchange-bubble{flex:1;border-radius:0 10px 10px 10px;padding:10px 14px}
.exchange-speaker{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px}
.exchange-line{font-size:13px;color:var(--text);line-height:1.5}
.spk-jordan .exchange-bubble{background:rgba(255,94,94,0.07);border:1px solid rgba(255,94,94,0.15)}.spk-jordan .exchange-speaker{color:#FF5E5E}
.spk-maya .exchange-bubble{background:rgba(181,123,255,0.07);border:1px solid rgba(181,123,255,0.15)}.spk-maya .exchange-speaker{color:#B57BFF}
.spk-david .exchange-bubble{background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.15)}.spk-david .exchange-speaker{color:#00D4FF}
.spk-zoe .exchange-bubble{background:rgba(255,181,71,0.07);border:1px solid rgba(255,181,71,0.15)}.spk-zoe .exchange-speaker{color:#FFB547}
.spk-robert .exchange-bubble{background:rgba(79,195,161,0.07);border:1px solid rgba(79,195,161,0.15)}.spk-robert .exchange-speaker{color:#4FC3A1}
.debate-summary{margin-top:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);letter-spacing:0.03em}
.debate-summary strong{color:var(--cyan)}

/* MODERATOR */
.moderator-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.mod-head{padding:24px 32px;background:linear-gradient(135deg,rgba(0,212,255,0.06),rgba(124,111,255,0.06));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
.mod-icon{font-size:28px}.mod-head-text h3{font-size:18px;font-weight:700;letter-spacing:-0.01em;margin-bottom:2px}.mod-head-text p{font-size:12px;color:var(--text2)}
.mod-body{padding:28px 32px;display:flex;flex-direction:column;gap:16px}
.signal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.signal-block{border-radius:10px;padding:16px;border:1px solid transparent}
.sig-pos{background:var(--green-bg);border-color:rgba(0,229,160,0.15)}.sig-neg{background:var(--red-bg);border-color:rgba(255,94,94,0.15)}
.sig-angle{grid-column:1/-1;background:var(--violet-bg);border-color:rgba(124,111,255,0.2)}
.sig-cyan{background:var(--cyan-bg);border-color:rgba(0,212,255,0.15)}.sig-amber{background:var(--amber-bg);border-color:rgba(255,181,71,0.15)}
.sig-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px}
.sig-pos .sig-label{color:var(--green)}.sig-neg .sig-label{color:var(--red)}.sig-angle .sig-label{color:var(--violet)}.sig-cyan .sig-label{color:var(--cyan)}.sig-amber .sig-label{color:var(--amber)}
.signal-block p{font-size:13px;color:var(--text);line-height:1.6}.sig-angle p{font-size:17px;font-style:italic;font-weight:500;line-height:1.4}
.lists-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list-block{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px}
.list-block-title{font-size:13px;font-weight:700;letter-spacing:-0.01em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.list-items{display:flex;flex-direction:column;gap:7px}
.list-item{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--text2);line-height:1.5}
.li-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;margin-top:1px}
.d-green{background:var(--green-bg);color:var(--green)}.d-red{background:var(--red-bg);color:var(--red)}.d-cyan{background:var(--cyan-bg);color:var(--cyan)}.d-amber{background:var(--amber-bg);color:var(--amber)}
.risks-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.risk-block{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px}
.risk-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.risk-block p{font-size:13px;color:var(--text2);line-height:1.55}
.disagree-block{background:var(--bg2);border:1px solid rgba(255,181,71,0.2);border-radius:10px;padding:16px}
.disagree-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.disagree-block p{font-size:13px;color:var(--text2);line-height:1.55}

.no-data{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.no-data p{font-size:16px;color:var(--text2)}.no-data a{color:var(--cyan);text-decoration:none}

@media(max-width:660px){
  nav{padding:0 20px}.rec-banner{padding:20px}.rec-score-num{font-size:36px}
  .split-row,.signal-row,.lists-row,.risks-row,.copy-signal-row,.copy-scores-row,.spread-grid{grid-template-columns:1fr}
  .sig-angle{grid-column:1}.mod-body{padding:20px}.mod-head{padding:20px}.personas-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo"><span class="logo-mark">◈</span>FocusAI</a>
  <div><a href="/" class="nav-btn">← NEW ANALYSIS</a></div>
</nav>

<div class="page">
  <div id="reportContent"><div class="no-data"><p>Loading report...</p></div></div>
</div>

<script>
var SPEAKER_CLASS={Jordan:'spk-jordan',Maya:'spk-maya',David:'spk-david',Zoe:'spk-zoe',Robert:'spk-robert'};
function scoreColor(v){return v>=7?'var(--green)':v>=5?'var(--amber)':'var(--red)'}
function avg(arr,key){return(arr.reduce(function(s,r){return s+(r[key]||0)},0)/arr.length).toFixed(1)}
function renderItems(items,dotClass,sym){
  if(!items||!items.length)return'<div class="list-item"><span style="color:var(--text3)">—</span></div>';
  return items.map(function(it){return'<div class="list-item"><span class="li-dot '+dotClass+'">'+sym+'</span><span>'+esc(it)+'</span></div>'}).join('');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderCopySection(ca){
  if(!ca) return '';
  var isClean = ca.copy_clean;
  var statusBadge = isClean===true
    ? '<span class="copy-status-badge copy-clean">✅ COPY CLEAN</span>'
    : isClean===false
      ? '<span class="copy-status-badge copy-issues">⚠ ISSUES FOUND</span>'
      : '<span class="copy-status-badge" style="background:var(--surface2);color:var(--text3);border:1px solid var(--border)">ANALYSIS UNAVAILABLE</span>';

  var scores = [
    {label:'QUALITY',val:ca.copy_quality_score},
    {label:'PERSUASION',val:ca.persuasion_score},
    {label:'READABILITY',val:ca.readability_score},
    {label:'TONE',val:ca.tone_consistency==='high'?9:ca.tone_consistency==='medium'?6:3},
    {label:'CLAIMS',val:ca.claim_quality==='strong'?9:ca.claim_quality==='mixed'?6:3}
  ].map(function(s){
    var v = s.val;
    var col = v>=7?'var(--green)':v>=5?'var(--amber)':'var(--red)';
    var disp = s.label==='TONE'?(ca.tone_consistency||'—'):s.label==='CLAIMS'?(ca.claim_quality||'—'):(v||'—');
    return '<div class="copy-score-box"><div class="copy-score-label">'+s.label+'</div><div class="copy-score-val" style="color:'+col+'">'+disp+'</div></div>';
  }).join('');

  var issuesList = '';
  if(ca.issues_found && ca.issues_found.length){
    issuesList = '<div class="copy-issues-list">'+ca.issues_found.slice(0,6).map(function(issue){
      return '<div class="copy-issue">'+
        '<div class="copy-issue-header"><span class="copy-issue-type">'+esc(issue.type)+'</span><span class="copy-issue-text">"'+esc(issue.text)+'"</span></div>'+
        '<div class="copy-issue-problem">'+esc(issue.problem)+'</div>'+
        (issue.suggested_fix?'<span class="copy-issue-fix">→ '+esc(issue.suggested_fix)+'</span>':'')+
      '</div>';
    }).join('')+'</div>';
  }

  var claimsAudit = '';
  if(ca.claims_audit && ca.claims_audit.length){
    claimsAudit = '<div class="claim-audit">'+
      '<div class="claim-audit-title">📋 Claims Audit</div>'+
      ca.claims_audit.map(function(c){
        var cls = c.classification==='strong'?'claim-strong':c.classification==='unsupported'?'claim-unsupported':'claim-weak';
        return '<div class="claim-item"><span class="claim-badge '+cls+'">'+esc(c.classification)+'</span>'+
          '<div><div class="claim-text">'+esc(c.claim)+'</div><div class="claim-reason">'+esc(c.reason)+'</div></div></div>';
      }).join('')+
    '</div>';
  }

  var rewrites = '';
  if(ca.rewrite_suggestions && ca.rewrite_suggestions.length){
    rewrites = '<div class="copy-rewrites">'+
      '<div class="copy-rewrites-title">✏️ Rewrite Suggestions</div>'+
      ca.rewrite_suggestions.slice(0,3).map(function(r){
        return '<div class="rewrite-item">'+
          '<div class="rewrite-orig">'+esc(r.original)+'</div>'+
          '<div class="rewrite-new">→ '+esc(r.rewrite)+'</div>'+
          '<div class="rewrite-reason">'+esc(r.reason)+'</div>'+
        '</div>';
      }).join('')+
    '</div>';
  }

  return [
    '<div class="copy-card">',
      '<div class="copy-head">',
        '<div class="copy-head-left"><span class="copy-head-icon">📝</span>',
          '<div class="copy-head-text"><h3>Copy Intelligence Audit</h3><p>Spelling · Grammar · Persuasion · Claims</p></div>',
        '</div>',
        statusBadge,
      '</div>',
      '<div class="copy-scores-row">'+scores+'</div>',
      '<div class="copy-body">',
        '<div class="copy-signal-row">',
          '<div class="copy-signal"><div class="copy-signal-label">Strongest Element</div><p>'+esc(ca.strongest_copy_element||'—')+'</p></div>',
          '<div class="copy-signal"><div class="copy-signal-label">Weakest Element</div><p>'+esc(ca.weakest_copy_element||'—')+'</p></div>',
        '</div>',
        issuesList,
        claimsAudit,
        rewrites,
      '</div>',
    '</div>'
  ].join('');
}

function renderConfidenceSection(conf){
  if(!conf) return '';
  var confClass = 'conf-'+(conf.confidence_level||'medium').toLowerCase();
  var rel = conf.reliability_score||5;
  var relColor = rel>=7?'var(--green)':rel>=5?'var(--amber)':'var(--red)';
  var sb = conf.score_breakdown||{};

  function spreadItem(label, data){
    if(!data) return '';
    var delta = data.spread||0;
    var deltaClass = delta<=2?'delta-low':delta<=4?'delta-med':'delta-high';
    return '<div class="spread-item">'+
      '<div class="spread-label">'+label+'</div>'+
      '<div class="spread-range">'+data.min+'–'+data.max+'</div>'+
      '<div class="spread-delta '+deltaClass+'">spread: '+delta+'</div>'+
    '</div>';
  }

  return [
    '<div class="confidence-card">',
      '<div class="confidence-head">',
        '<div class="confidence-head-left"><span style="font-size:22px">🔬</span>',
          '<div class="copy-head-text"><h3>Confidence & Reliability</h3><p>Based on persona score variance analysis</p></div>',
        '</div>',
        '<span class="confidence-pill '+confClass+'">'+esc(conf.confidence_level||'MEDIUM')+'</span>',
      '</div>',
      '<div class="confidence-body">',
        '<div class="confidence-main">',
          '<div class="reliability-dial">',
            '<div class="reliability-num" style="color:'+relColor+'">'+rel+'</div>',
            '<div class="reliability-label">RELIABILITY /10</div>',
          '</div>',
          '<div class="confidence-reason">'+esc(conf.confidence_reason||'')+'</div>',
        '</div>',
        '<div class="spread-grid">',
          spreadItem('ATTENTION SPREAD',sb.attention),
          spreadItem('TRUST SPREAD',sb.trust),
          spreadItem('INTEREST SPREAD',sb.interest),
        '</div>',
      '</div>',
    '</div>'
  ].join('');
}

function renderPersonaCard(r){
  var p=r.persona, color=p.color||'#7C6FFF', stop=r.would_stop_scrolling;
  var av=r.attention_score||5, tv=r.trust_score||5, iv=r.interest_score||5;
  return [
    '<div class="persona-card">',
      '<div class="persona-stripe" style="background:'+color+'"></div>',
      '<div class="p-head">',
        '<div class="p-head-top">',
          '<div class="p-id"><span class="p-emoji">'+p.emoji+'</span>',
            '<div><div class="p-name">'+esc(p.name)+'</div><div class="p-type">'+esc(p.label)+'</div></div>',
          '</div>',
          '<span class="scroll-badge '+(stop?'scroll-yes':'scroll-no')+'">'+(stop?'▶ STOPS':'✕ SCROLLS PAST')+'</span>',
        '</div>',
        '<div class="demo-chips">',
          (p.age?'<span class="demo-chip">AGE '+p.age+'</span>':''),
          (p.gender?'<span class="demo-chip">'+esc(p.gender)+'</span>':''),
          (p.archetype?'<span class="demo-chip">'+esc(p.archetype)+'</span>':''),
          (p.default_skepticism?'<span class="demo-chip">SKEPTICISM: '+esc(p.default_skepticism.split(' ')[0])+'</span>':''),
        '</div>',
      '</div>',
      '<div class="p-body">',
        '<div class="score-bars">',
          '<div class="bar-item"><div class="bar-label">Attention</div><div class="bar-track"><div class="bar-fill fill-a" style="width:'+av*10+'%"></div></div><div class="bar-val" style="color:'+scoreColor(av)+'">'+av+'</div>'+(r.attention_reason?'<div class="score-reason">'+esc(r.attention_reason)+'</div>':'')+'</div>',
          '<div class="bar-item"><div class="bar-label">Trust</div><div class="bar-track"><div class="bar-fill fill-t" style="width:'+tv*10+'%"></div></div><div class="bar-val" style="color:'+scoreColor(tv)+'">'+tv+'</div>'+(r.trust_reason?'<div class="score-reason">'+esc(r.trust_reason)+'</div>':'')+'</div>',
          '<div class="bar-item"><div class="bar-label">Interest</div><div class="bar-track"><div class="bar-fill fill-i" style="width:'+iv*10+'%"></div></div><div class="bar-val" style="color:'+scoreColor(iv)+'">'+iv+'</div>'+(r.interest_reason?'<div class="score-reason">'+esc(r.interest_reason)+'</div>':'')+'</div>',
        '</div>',
        (r.trust_factors_used?'<div class="trust-rubric">TRUST RUBRIC: '+esc(r.trust_factors_used)+'</div>':''),
        (r.visual_evidence_found?'<div class="evidence-pill">👁 VISUAL: '+esc(r.visual_evidence_found)+'</div>':''),
        '<div class="reaction-text">'+esc(r.first_reaction||'')+'</div>',
        '<div class="objection-label">⚠ MAIN OBJECTION</div>',
        '<div class="objection-text">'+esc(r.main_objection||'')+'</div>',
        '<div class="quote-block">"'+esc(r.quote||'')+'"</div>',
      '</div>',
    '</div>'
  ].join('');
}

function renderDebate(debate){
  if(!debate||!debate.exchanges||!debate.exchanges.length) return '';
  var items=debate.exchanges.map(function(ex,i){
    var cls=SPEAKER_CLASS[ex.speaker]||'spk-jordan';
    return '<div class="exchange '+cls+'" style="animation-delay:'+(i*0.06)+'s">'+
      '<div class="exchange-bubble">'+
        '<div class="exchange-speaker">'+esc(ex.speaker)+'</div>'+
        '<div class="exchange-line">'+esc(ex.line)+'</div>'+
      '</div></div>';
  }).join('');
  return '<div class="debate-card">'+
    '<div class="debate-head"><span class="debate-icon">💬</span><div class="debate-head-text"><h3>The Debate Room</h3><p>Personas challenge each other directly</p></div></div>'+
    '<div class="debate-body">'+items+
      (debate.debate_summary?'<div class="debate-summary"><strong>CORE TENSION:</strong> '+esc(debate.debate_summary)+'</div>':'')+
    '</div></div>';
}

function renderRecommendation(m){
  var rec=(m.decision_recommendation||'REVISE').toUpperCase();
  var recClass=rec==='LAUNCH'?'rec-launch':rec==='REJECT'?'rec-reject':'rec-revise';
  var confClass='conf-'+(m.confidence_level||'MEDIUM').toLowerCase();
  var split=m.audience_split||{};
  var lovedChips=(split.loved_it||[]).map(function(n){return'<span class="split-name-chip">'+esc(n)+'</span>'}).join('');
  var rejChips=(split.rejected_it||[]).map(function(n){return'<span class="split-name-chip">'+esc(n)+'</span>'}).join('');
  var neutChips=(split.neutral||[]).map(function(n){return'<span class="split-name-chip">'+esc(n)+'</span>'}).join('');
  return [
    '<div class="rec-banner '+recClass+'">',
      '<div><div class="rec-verdict-label">RECOMMENDATION</div><div class="rec-verdict">'+rec+'</div></div>',
      '<div class="rec-rationale">'+esc(m.decision_rationale||m.executive_summary||'')+'</div>',
      '<div class="rec-meta">',
        '<div><span class="rec-score-num">'+(m.final_score||'—')+'</span><span class="rec-score-denom"> /10</span></div>',
        '<span class="confidence-pill '+confClass+'">CONFIDENCE: '+(m.confidence_level||'MEDIUM')+'</span>',
      '</div>',
    '</div>',
    '<div class="split-row">',
      '<div class="split-block split-loved"><div class="split-label">Loved It</div><div class="split-names">'+(lovedChips||'<span style="color:var(--text3);font-size:12px">—</span>')+'</div></div>',
      '<div class="split-block split-rejected"><div class="split-label">Rejected It</div><div class="split-names">'+(rejChips||'<span style="color:var(--text3);font-size:12px">—</span>')+'</div></div>',
      '<div class="split-block split-neutral"><div class="split-label">Neutral</div><div class="split-names">'+(neutChips||'<span style="color:var(--text3);font-size:12px">—</span>')+'</div></div>',
    '</div>'
  ].join('');
}

function renderReport(data){
  var personas=data.personas, debate=data.debate||{}, m=data.moderator||{};
  var copyA=data.copy_analysis||null, conf=data.confidence||null;
  var html=[
    '<div class="report-header">',
      '<div class="report-eyebrow">// FOCUS GROUP REPORT · VERSION 3</div>',
      '<div class="report-title">Ad Analysis Complete</div>',
      '<div class="report-meta">5 PERSONAS · COPY AUDIT · CONFIDENCE ENGINE · '+new Date().toLocaleTimeString()+'</div>',
    '</div>',
    renderRecommendation(m),
    '<div class="section">',
      '<div class="sec-heading"><h2>Copy Intelligence</h2><span class="sec-tag">COPY AUDIT</span></div>',
      renderCopySection(copyA),
    '</div>',
    '<div class="section">',
      '<div class="sec-heading"><h2>Analysis Confidence</h2><span class="sec-tag">RELIABILITY</span></div>',
      renderConfidenceSection(conf),
    '</div>',
    '<div class="section">',
      '<div class="sec-heading"><h2>Persona Reactions</h2><span class="sec-tag">5 CONSUMERS</span></div>',
      '<div class="personas-grid">'+personas.map(renderPersonaCard).join('')+'</div>',
    '</div>',
    '<div class="section">',
      '<div class="sec-heading"><h2>The Debate Room</h2><span class="sec-tag">INTER-PERSONA</span></div>',
      renderDebate(debate),
    '</div>',
    '<div class="section">',
      '<div class="sec-heading"><h2>Moderator Report</h2><span class="sec-tag">SYNTHESIS</span></div>',
      '<div class="moderator-card">',
        '<div class="mod-head"><span class="mod-icon">🎯</span><div class="mod-head-text"><h3>Senior Moderator Analysis</h3><p>Synthesized from all inputs</p></div></div>',
        '<div class="mod-body">',
          '<div class="signal-row">',
            '<div class="signal-block sig-pos"><div class="sig-label">Strongest Signal ↑</div><p>'+esc(m.strongest_positive||'—')+'</p></div>',
            '<div class="signal-block sig-neg"><div class="sig-label">Biggest Risk ↓</div><p>'+esc(m.strongest_negative||'—')+'</p></div>',
          '</div>',
          (m.disagreement_reason?'<div class="disagree-block"><div class="disagree-label">⚡ WHY PERSONAS DISAGREED</div><p>'+esc(m.disagreement_reason)+'</p></div>':''),
          '<div class="lists-row">',
            '<div class="list-block"><div class="list-block-title">✅ Likely Strengths</div><div class="list-items">'+renderItems(m.likely_strengths,'d-green','✓')+'</div></div>',
            '<div class="list-block"><div class="list-block-title">⚠ Likely Weaknesses</div><div class="list-items">'+renderItems(m.likely_weaknesses,'d-red','!')+'</div></div>',
          '</div>',
          '<div class="risks-row">',
            '<div class="risk-block"><div class="risk-title">⚡ ATTENTION RISKS</div><p>'+esc(m.attention_risks||'—')+'</p></div>',
            '<div class="risk-block"><div class="risk-title">🔒 TRUST RISKS</div><p>'+esc(m.trust_risks||'—')+'</p></div>',
          '</div>',
          '<div class="list-block" style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px">',
            '<div class="list-block-title">💡 Top 3 Specific Improvements</div>',
            '<div class="list-items">'+renderItems(m.top_improvements||m.recommended_improvements,'d-cyan','→')+'</div>',
          '</div>',
          '<div class="signal-row"><div class="signal-block sig-angle"><div class="sig-label">Suggested Ad Angle</div><p>'+esc(m.suggested_angle||'—')+'</p></div></div>',
        '</div>',
      '</div>',
    '</div>'
  ].join('');
  document.getElementById('reportContent').innerHTML=html;
  setTimeout(function(){
    document.querySelectorAll('.bar-fill').forEach(function(bar){
      var w=bar.style.width; bar.style.width='0';
      setTimeout(function(){bar.style.width=w},120);
    });
  },100);
}

var raw=sessionStorage.getItem('focusGroupResult');
if(raw){try{renderReport(JSON.parse(raw))}catch(e){document.getElementById('reportContent').innerHTML='<div class="no-data"><p>Error rendering report.</p><p><a href="/">Run a new analysis</a></p></div>'}}
else{document.getElementById('reportContent').innerHTML='<div class="no-data"><p>No report data found.</p><p><a href="/">Run an analysis first</a></p></div>'}
</script>
</body>
</html>
